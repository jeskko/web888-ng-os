# Read-only Yocto mirror: source downloads and shared state for local
# builds (PREMIRRORS / SSTATE_MIRRORS). Only the CI job writes to /srv/yocto.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /srv/yocto;
    autoindex on;
    location / {
        limit_except GET HEAD { deny all; }
    }
}
