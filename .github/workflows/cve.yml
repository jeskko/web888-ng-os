# SPDX-License-Identifier: GPL-3.0-or-later
# Known CVEs in the newest release's image: Bootlin's sbom-cve-check (as
# packaged by OpenEmbedded-Core) on the release's SPDX 3 SBOM, which
# carries Yocto's own assessments (patched, not affected, the kernel's
# compiled sources), against the CVE List and NVD. Dependabot can't see
# Yocto's packages; this does. On GitHub's runners only: the release
# files and the public CVE databases, no build.
#
# * Everything still unpatched goes to code scanning (Security tab); an
#   alert closes when a later scan no longer finds it.
# * Code scanning doesn't notify, so one issue (label cve-scan, assigned
#   to the repository's owner) says how many of CVSS 7.0 or more are
#   unhandled, with no details: opened when there are some, a comment
#   when new ones turn up, closed when none are left.
# * The details stay in code scanning (maintainers only): no artifacts
#   (anyone can download a public repo's) and only counts in the logs.
# * Run by hand with sbom = main, it scans the newest main build instead
#   and only reports the counts (the job summary): no alerts, no issue.
name: cve

on:
  schedule:
    - cron: "23 4 * * *" # daily
  workflow_dispatch:
    inputs:
      sbom:
        description: "release: the newest release; main: the newest main build (artifacts only)"
        type: choice
        options: [release, main]
        default: release

permissions:
  contents: read

concurrency:
  group: cve
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # a main build's artifact
      security-events: write # the SARIF
      issues: write # the notification issue
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SCAN: ${{ inputs.sbom != 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sbom-cve-check (pinned by hash)
        run: pip install --require-hashes --no-deps -r .github/cve-requirements.txt
      - name: the SBOM
        run: |
          mkdir sbom
          if [ "$RELEASE_SCAN" = true ]; then
            tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
            gh release download "$tag" --pattern 'web888-ng-sd-*.spdx.json' --dir sbom
            mv sbom/*.spdx.json sbom/image.spdx.json
          else
            id=$(gh run list --workflow build --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            gh run download "$id" --name web888-image --dir img
            mv img/web888-image-web888.rootfs.spdx.json sbom/image.spdx.json
            tag="main@$(gh run view "$id" --json headSha --jq '.headSha[:7]')"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          ls -l sbom
      # the CVE List and NVD clones (shallow; sbom-cve-check fetches what
      # is new since)
      - uses: actions/cache@v4
        with:
          path: cve-db
          key: cve-db-${{ github.run_id }}
          restore-keys: cve-db-
      - name: scan
        run: |
          sbom-cve-check \
            --databases-dir cve-db \
            --sbom-path sbom/image.spdx.json \
            --export-process-native target \
            --export-filter-vulnerable \
            --export-type yocto-cve-check-manifest --export-path cve.json \
            --export-type summary --export-path cve.txt
          python3 scripts/cve-sarif.py cve.json "$TAG" > cve.sarif
      - name: counts
        run: |
          python3 - "$TAG" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          from importlib import import_module
          score = import_module("cve-issue").score
          k = ("linux-xlnx", "linux-yocto")
          n = {"all": 0, "high": 0, "kernel": 0, "kernel_high": 0}
          for p in json.load(open("cve.json")).get("package", []):
              for i in p.get("issue", []):
                  if i.get("status") != "Unpatched":
                      continue
                  hi = score(i) >= 7.0
                  kern = p.get("name") in k
                  n["all"] += 1; n["high"] += hi; n["kernel"] += kern; n["kernel_high"] += kern and hi
          print(f"Unhandled CVEs in {sys.argv[1]}'s image: {n['all']} "
                f"({n['high']} of CVSS 7.0 or more); in the kernel {n['kernel']} ({n['kernel_high']}).")
          PY
      - if: env.RELEASE_SCAN == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cve.sarif
          category: yocto-cve
      # what the last release scan reported, to tell what is new
      - if: env.RELEASE_SCAN == 'true'
        uses: actions/cache@v4
        with:
          path: cve-state
          key: cve-state-${{ github.run_id }}
          restore-keys: cve-state-
      - name: the issue
        if: env.RELEASE_SCAN == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          n=$(python3 scripts/cve-issue.py cve.json "$TAG" cve-state/ids.txt out)
          mkdir -p cve-state
          cp out/ids.txt cve-state/ids.txt
          issue=$(gh issue list --label cve-scan --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ ! -s out/body.md ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "No unhandled CVEs of CVSS 7.0 or more in $TAG's image any more ($RUN_URL)."
            fi
            exit 0
          fi
          if [ -z "$issue" ]; then
            gh label create cve-scan --color B60205 --description "The daily CVE scan of the image" 2>/dev/null || true
            gh issue create --title "Unhandled CVEs of CVSS 7.0 or more in the image" \
              --label cve-scan --assignee "$OWNER" --body-file out/body.md
          else
            gh issue edit "$issue" --body-file out/body.md
            if [ -s out/new.md ]; then
              gh issue comment "$issue" --body-file out/new.md
            fi
          fi
          echo "$n reported"
