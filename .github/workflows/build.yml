# SPDX-License-Identifier: GPL-3.0-or-later
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one image build per branch: a newer push cancels the running one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap check on GitHub-hosted runners, also for pull requests.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install kas==5.5
      - run: kas dump kas/web888.yml > /dev/null
      - run: kas dump kas/web888.yml:kas/mirror.yml > /dev/null
        env:
          WEB888_MIRROR: http://mirror.invalid

  # Full image build on the project's self-hosted runner. Never runs for
  # pull requests (fork code must not reach the runner), and stays off
  # until the repository variable SELF_HOSTED_RUNNER is "true".
  image:
    if: github.event_name != 'pull_request' && vars.SELF_HOSTED_RUNNER == 'true'
    needs: config
    runs-on: [self-hosted, linux, yocto]
    timeout-minutes: 600
    env:
      # layer clones borrow objects from persistent reference repos (kas
      # creates them on first use); only new commits come from the network
      KAS_REPO_REF_DIR: /srv/yocto/repos
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: kas build kas/web888.yml:kas/ci.yml
      - uses: actions/upload-artifact@v4
        with:
          name: web888-image
          path: |
            build/tmp/deploy/images/web888/web888-image-web888.rootfs.wic.xz
            build/tmp/deploy/images/web888/web888-image-web888.rootfs.wic.bmap
            build/tmp/deploy/images/web888/*.squashfs-xz
            build/tmp/deploy/images/web888/uImage
            build/tmp/deploy/images/web888/boot.bin
            build/tmp/deploy/images/web888/u-boot.img
            build/tmp/deploy/images/web888/web888-chainboot-initramfs-web888.cpio.gz
            build/tmp/deploy/images/web888/*.spdx.json
          if-no-files-found: error
      - name: release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          d=build/tmp/deploy/images/web888
          mkdir release
          v=$GITHUB_REF_NAME
          cp -L $d/web888-image-web888.rootfs.wic.xz release/web888-ng-sd-$v.img.xz
          cp -L $d/web888-image-web888.rootfs.wic.bmap release/web888-ng-sd-$v.img.bmap
          cp -L $d/web888-image-web888.rootfs.spdx.json release/web888-ng-sd-$v.spdx.json
          cp -L $d/web888-image-web888.rootfs.manifest release/web888-ng-sd-$v.manifest
          (cd release && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Tags: a GitHub release with the SD card image (pre-release for v0.*),
  # the notes from docs/release-notes/<tag>.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in v0.*) pre=--prerelease ;; esac
          notes="src/docs/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || { echo "::error::no $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "web888-ng SD image $GITHUB_REF_NAME" --notes-file "$notes" $pre out/*
