name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one image build per branch: a newer push cancels the running one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap check on GitHub-hosted runners, also for pull requests.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install kas==5.5
      - run: kas dump kas/web888.yml > /dev/null
      - run: kas dump kas/web888.yml:kas/mirror.yml > /dev/null
        env:
          WEB888_MIRROR: http://mirror.invalid

  # Full image build on the project's self-hosted runner. Never runs for
  # pull requests (fork code must not reach the runner), and stays off
  # until the repository variable SELF_HOSTED_RUNNER is "true".
  image:
    if: github.event_name != 'pull_request' && vars.SELF_HOSTED_RUNNER == 'true'
    needs: config
    runs-on: [self-hosted, linux, yocto]
    timeout-minutes: 600
    env:
      # layer clones borrow objects from persistent reference repos (kas
      # creates them on first use); only new commits come from the network
      KAS_REPO_REF_DIR: /srv/yocto/repos
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: kas build kas/web888.yml:kas/ci.yml
      - uses: actions/upload-artifact@v4
        with:
          name: web888-image
          path: |
            build/tmp/deploy/images/web888/*.wic*
            build/tmp/deploy/images/web888/*.squashfs-xz
            build/tmp/deploy/images/web888/uImage
            build/tmp/deploy/images/web888/web888-chainboot-initramfs-web888.cpio.gz
            build/tmp/deploy/images/web888/*.spdx.json
          if-no-files-found: error
