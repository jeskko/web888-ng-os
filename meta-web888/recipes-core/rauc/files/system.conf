# RAUC on the Web-888: two root slots on the SD card (meta-web888/files/
# wic/web888-sd.wks), chosen by U-Boot's boot chooser (recipes-bsp/
# u-boot/files/web888.env: BOOT_ORDER, BOOT_<slot>_LEFT, 3 tries).
# web888-boot-ok marks the booted slot good once web888d runs.
[system]
compatible=web888
bootloader=uboot
bundle-formats=verity
boot-attempts=3
boot-attempts-primary=3
# the root is read-only: RAUC's slot status on the configuration partition
data-directory=/config/rauc

[keyring]
path=/usr/lib/rauc/web888-ca.cert.pem
check-purpose=codesign
# a unit without a battery-backed clock may update before NTP: check the
# certificate at the bundle's signing time
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A
resize=true

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
resize=true
