# chronyd on the Web-888 (docs/owner-guide.md §5)

# NTP: Google's public time servers (systemd's defaults, used before
# chrony). Four servers let chrony outvote a bad one.
server time1.google.com iburst
server time2.google.com iburst
server time3.google.com iburst
server time4.google.com iburst

# The LF time-code stations web888d receives ([timecode] in its config):
# each decoded minute, per station, a sample of the system clock's error
# (chrony's SOCK protocol; chronyd makes the socket). Ms-level samples:
# the generous delay keeps NTP in charge while it is reachable, and the
# stations carry the clock when it isn't (holdover without the Internet).
refclock SOCK /run/chrony.web888.sock refid LF poll 6 filter 16 precision 1e-3 delay 0.02

# The board has no battery-backed clock: it starts at the image's build
# time, so the first updates may step the clock.
makestep 1 3

# The crystal's frequency error, kept across boots on the configuration
# partition (the root is read-only).
driftfile /config/chrony/drift

# Let the kernel's "unsynchronised" flag follow chrony: on Linux chrony
# clears it only with rtcsync, and web888d reads it (adjtimex) for the
# receiver clock's state. The board has no RTC, so the kernel's
# 11-minute RTC update this also enables has nothing to write.
rtcsync

# NTP for the local network: off unless web888d's [timesync] serve_lan
# runs `chronyc allow` for the private and link-local ranges (nothing is
# allowed here, so chrony answers no one). Then a client asking more often
# than every 8 s on average (bursts of 8: iburst fits) has requests
# dropped, so one can't make the receiver answer floods.
ratelimit interval 3 burst 8 leak 2

# chronyc on the unit itself only (no network command port); no logs.
cmdport 0
