# Chain-loading from the stock firmware (web888-chainboot-initramfs): the
# root is a squashfs file under a RAM overlay. netconsole: the kernel log
# over UDP from a unit without a reachable serial console.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_OVERLAY_FS=y
CONFIG_NETCONSOLE=y
# GPS PPS on EMIO GPIO 54 (the vendor device tree's pps-gpio node)
CONFIG_PPS_CLIENT_GPIO=y
# The kernel log in RAM (ramoops), kept over a watchdog reset into the
# stock firmware: the device tree reserves the region (chainboot-pack.sh)
CONFIG_PSTORE=y
CONFIG_PSTORE_CONSOLE=y
CONFIG_PSTORE_RAM=y
# CONFIG_PSTORE_COMPRESS is not set
# RAUC: verity bundles are a squashfs checked by dm-verity on a loop
# device, or on NBD when streamed from a URL
CONFIG_BLK_DEV_LOOP=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_BLK_DEV_NBD=y
CONFIG_CRYPTO_SHA256=y
