# Web-888: on top of xilinx_zynq_virt_defconfig. One board, its own
# device tree (zynq-web888.dts), SPL with the PS7 init of our Vivado
# design, the environment on the SD card (two copies) and the A/B boot
# chooser (web888.env).
CONFIG_DEFAULT_DEVICE_TREE="zynq-web888"
CONFIG_OF_LIST="zynq-web888"
CONFIG_ENV_SOURCE_FILE="web888"
# CONFIG_DISTRO_DEFAULTS is not set
CONFIG_BOOTCOMMAND="env default -f web888_boot; run web888_boot"
CONFIG_BOOTDELAY=1

# the environment: raw on the SD card, 1 MiB and 1.25 MiB (the first
# partition starts at 4 MiB)
# CONFIG_ENV_IS_NOWHERE is not set
# CONFIG_ENV_IS_IN_FAT is not set
# CONFIG_ENV_IS_IN_NAND is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
CONFIG_ENV_IS_IN_MMC=y
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0x100000
CONFIG_ENV_OFFSET_REDUND=0x140000
CONFIG_SYS_MMC_ENV_DEV=0
CONFIG_SYS_MMC_ENV_PART=0

# the watchdog from here on: a boot that hangs resets the unit, and the
# boot chooser counts it
CONFIG_WDT=y
CONFIG_WDT_CDNS=y
CONFIG_WATCHDOG_AUTOSTART=y
CONFIG_WATCHDOG_TIMEOUT_MSECS=60000

CONFIG_CMD_EXT4=y
CONFIG_CMD_SETEXPR=y
CONFIG_NO_NET=y
