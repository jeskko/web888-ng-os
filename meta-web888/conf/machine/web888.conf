#@TYPE: Machine
#@NAME: web888
#@DESCRIPTION: Web-888 SDR (Zynq-7010 xc7z010clg400-1, 512 MB DDR3, LTC2208 ADC)

# First bring-up: the generic Zynq-7000 machine from meta-xilinx-core.
# Still to come here: our device tree, our kernel (6.18 LTS with
# fpga_manager), U-Boot with a redundant environment for RAUC, and the
# boot files for the real board (FSBL/SPL from our Vivado design).
require conf/machine/zynq-generic.conf

SERIAL_CONSOLES = "115200;ttyPS0"

# SD layout: boot, root, config (meta-web888/wic/web888-sd.wks)
WKS_FILE = "web888-sd.wks"
