#@TYPE: Machine
#@NAME: web888
#@DESCRIPTION: Web-888 SDR (Zynq-7010 xc7z010clg400-1, 512 MB DDR3, LTC2208 ADC)

# On the generic Zynq-7000 machine from meta-xilinx-core, with our own
# boot chain: U-Boot SPL with the PS7 initialisation of our Vivado design
# (no Xilinx FSBL), U-Boot choosing an A/B root slot, the kernel and our
# device tree from inside that slot.
require conf/machine/zynq-generic.conf

SERIAL_CONSOLES = "115200;ttyPS0"

# Mainline U-Boot (oe-core), SPL as BOOT.BIN; the PS7 init files come
# with the bbappend, not from a Xilinx hardware description
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
PREFERRED_PROVIDER_virtual/boot-bin = "u-boot"
SPL_BINARY = "spl/boot.bin"
UBOOT_SUFFIX = "img"
HAS_PLATFORM_INIT:append = " xilinx_zynq_virt_defconfig"

# The board's device tree, built with the kernel and installed in the
# root's /boot next to the kernel (U-Boot loads both from the slot)
KERNEL_DEVICETREE = "xilinx/zynq-web888.dtb"

# SD layout (meta-web888/files/wic/web888-sd.wks): FAT WEB888 (BOOT.BIN,
# u-boot.img, web888.txt), root slots A and B, config
WKS_FILE = "web888-sd.wks"
IMAGE_BOOT_FILES = "boot.bin u-boot.img web888.txt"
# fstab comes from base-files only (wic would add duplicate entries with
# default options, e.g. /boot read-write; its per-partition
# --no-fstab-update is parsed but not honoured)
WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"
