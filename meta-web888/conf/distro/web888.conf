# Appliance distro for the Web-888: small, read-only root, no package
# manager on the device (updates are whole-image RAUC bundles).

DISTRO = "web888"
DISTRO_NAME = "web888-ng"
DISTRO_VERSION = "0.3.0"
DISTRO_CODENAME = "wrynose"
MAINTAINER = "web888-ng <https://github.com/jeskko/web888-ng-os>"

DISTRO_FEATURES = "ipv4 ipv6 usbhost largefile acl xattr rauc"
INIT_MANAGER = "systemd"

# SBOM and CVE reports for every build
INHERIT += "create-spdx"

TCLIBC = "glibc"

# U-Boot from its GitHub mirror (the same repository and tags):
# source.denx.de served a first clone at a few kB/s
PREMIRRORS:prepend = "git://source\.denx\.de/u-boot/u-boot\.git git://github.com/u-boot/u-boot.git;protocol=https \n"
