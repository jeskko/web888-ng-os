# SPDX-License-Identifier: GPL-3.0-or-later
# Appliance distro for the Web-888: small, read-only root, no package
# manager on the device (updates are whole-image RAUC bundles).

DISTRO = "web888"
DISTRO_NAME = "web888-ng"
DISTRO_VERSION = "0.9.1"
DISTRO_CODENAME = "wrynose"
MAINTAINER = "web888-ng <https://github.com/jeskko/web888-ng-os>"

DISTRO_FEATURES = "ipv4 ipv6 usbhost largefile acl xattr rauc"
# OE-Core appends its DISTRO_FEATURES_DEFAULTS to the list above unless a
# feature is opted out (bluetooth, wifi, 3g, nfc, nfs, x11, wayland,
# alsa, pulseaudio, opengl, ptest, ...): up to os v0.9.0 that put BlueZ,
# ofono, neard, rpcbind, wpa_supplicant and libX11 in the image, none of
# them used, with their CVEs. Only these: ext2/vfat (the card), zeroconf
# (avahi: <hostname>.local), seccomp and ldconfig (systemd, glibc).
DISTRO_FEATURES_DEFAULTS = "acl ext2 ipv4 ipv6 xattr vfat zeroconf seccomp ldconfig"
INIT_MANAGER = "systemd"

# glibc: the head of release/2.43/master (wrynose's pin plus a CVE fix,
# CVE-2026-84243, and five aarch64/header fixes); glibc_%.bbappend
# records the CVEs fixed in it
SRCREV_glibc = "45e49b1ea2e58dc06d372adf346f9e8cac4ff767"

# SBOM and CVE reports for every build
INHERIT += "create-spdx"
# for the CVE scan of a release (.github/workflows/cve.yml; as OE-Core's
# sbom-cve-check fragment): all of Yocto's CVE annotations in the SBOM.
# (Its SPDX_INCLUDE_COMPILED_SOURCES for the kernel needs the kernel's
# debug info, which ours is built without: it listed all 91k source
# files, and filtered nothing.)
SPDX_INCLUDE_VEX = "all"
# Two more CVE_STATUS kinds for CVEs whose code is built but which can't
# be used against this system (the reason goes in each status): both
# count as handled (Ignored) and keep their VEX justification in the SBOM
CVE_CHECK_STATUSMAP[mitigated] = "Ignored"
CVE_CHECK_VEX_JUSTIFICATION[mitigated] = "inlineMitigationsAlreadyExist"
CVE_CHECK_STATUSMAP[not-reachable] = "Ignored"
CVE_CHECK_VEX_JUSTIFICATION[not-reachable] = "vulnerableCodeCannotBeControlledByAdversary"

TCLIBC = "glibc"

# U-Boot from its GitHub mirror (the same repository and tags):
# source.denx.de served a first clone at a few kB/s
PREMIRRORS:prepend = "git://source\.denx\.de/u-boot/u-boot\.git git://github.com/u-boot/u-boot.git;protocol=https \n"
